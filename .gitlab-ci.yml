stages:
  - deploy

# Publishes the tagged version to the GitLab Composer package registry.
publish-composer:
  stage: deploy
  image:
    name: curlimages/curl:8.11.1
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - 'curl --fail-with-body --header "Job-Token: $CI_JOB_TOKEN" --data tag="$CI_COMMIT_TAG" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/composer"'
